[workspace]
resolver = "2"

members = [
    "crates/t-digest-lib",
    "extension",
    "tools/post-install",
    "tools/sql-doctester",
    "tools/update-tester",
]

[profile.release]
lto = "fat"
debug = true
codegen-units = 1

# pgrx with fixes for 32-bit platforms (PGlite's wasm32), where 8-byte types are passed by
# reference; see vendor/pgrx
[patch.crates-io]
pgrx = { path = "vendor/pgrx" }
